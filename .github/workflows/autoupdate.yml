name: Auto-Update Manifests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for updates
        shell: pwsh
        run: |
          $updated = $false
          Get-ChildItem "${{ github.workspace }}\bucket\*.json" | ForEach-Object {
            $manifestPath = $_.FullName
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            $appName = $_.BaseName

            # Extract GitHub repo from checkver.github URL
            $checkverUrl = $manifest.checkver.github
            if (-not $checkverUrl) {
              Write-Host "$appName : no github checkver, skipping"
              return
            }
            $repo = $checkverUrl -replace '^https://github\.com/', ''
            Write-Host "Checking $appName (repo: $repo) ..."

            # Get latest release tag
            $latest = gh release view --repo $repo --json tagName,assets 2>&1 | ConvertFrom-Json
            if (-not $latest) {
              Write-Host "  Failed to fetch release info"
              return
            }
            $latestTag = $latest.tagName -replace '^v', ''
            $currentVer = $manifest.version
            Write-Host "  current: $currentVer, latest: $latestTag"

            if ($latestTag -eq $currentVer) {
              Write-Host "  $appName is up to date."
              return
            }

            # Build download URL from autoupdate template
            $urlTemplate = $manifest.autoupdate.architecture.'64bit'.url
            $newUrl = $urlTemplate -replace '\$version', $latestTag
            $fileName = Split-Path $newUrl -Leaf

            Write-Host "  Downloading $fileName ..."
            $tempFile = Join-Path $env:TEMP $fileName
            try {
              curl -sL -o $tempFile $newUrl
              if (-not (Test-Path $tempFile) -or (Get-Item $tempFile).Length -eq 0) {
                Write-Host "  Download failed, skipping"
                return
              }
              $hash = (Get-FileHash $tempFile -Algorithm SHA256).Hash.ToLower()
              Write-Host "  SHA256: $hash"
            } catch {
              Write-Host "  Error: $_"
              return
            } finally {
              if (Test-Path $tempFile) { Remove-Item $tempFile }
            }

            # Update manifest
            $manifest.version = $latestTag
            $manifest.architecture.'64bit'.url = $newUrl
            $manifest.architecture.'64bit'.hash = $hash

            # Update pre_install if it references the old version
            if ($manifest.pre_install) {
              for ($i = 0; $i -lt $manifest.pre_install.Count; $i++) {
                $manifest.pre_install[$i] = $manifest.pre_install[$i] -replace $currentVer, $latestTag
              }
            }

            $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding UTF8
            Write-Host "  $appName updated to $latestTag !"
            $updated = $true
          }

          if (-not $updated) {
            Write-Host "All manifests are up to date."
          }

      - name: Sync README app table with manifests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const bucketDir = process.env.GITHUB_WORKSPACE + '/bucket';
            const files = fs.readdirSync(bucketDir).filter(f => f.endsWith('.json')).sort();
            const rows = [];
            for (const file of files) {
              const m = JSON.parse(fs.readFileSync(path.join(bucketDir, file), 'utf8'));
              rows.push(`| [${path.basename(file, '.json')}](${m.homepage || ''}) | ${m.description || ''} | ${m.version || ''} |`);
            }
            const table = '| 应用 | 描述 | 版本 |\n|------|------|------|\n' + rows.join('\n');
            const readmePath = process.env.GITHUB_WORKSPACE + '/README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            const re = /<!-- APPS_TABLE_BEGIN -->[\s\S]*?<!-- APPS_TABLE_END -->/;
            const updated = readme.replace(re, '<!-- APPS_TABLE_BEGIN -->\n' + table + '\n<!-- APPS_TABLE_END -->');
            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
              console.log('README synced.');
            }

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update manifests"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.head_ref }}
