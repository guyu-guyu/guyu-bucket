name: Auto-Update Manifests

on:
  schedule:
    # 每天凌晨 3 点检查更新
    - cron: '0 3 * * *'
  workflow_dispatch:   # 也支持手动触发

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod get.scoop.sh | Invoke-Expression
          scoop bucket add guyu-bucket ${{ github.workspace }}

      - name: Check and update manifests
        shell: pwsh
        continue-on-error: true
        run: |
          $hasUpdates = $false
          Get-ChildItem "${{ github.workspace }}\bucket\*.json" | ForEach-Object {
            $appName = $_.BaseName
            Write-Host "Checking $appName ..."
            $result = scoop checkver $appName --update 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  $appName is up to date."
            } elseif ($result -match "New version") {
              Write-Host "  $appName has been updated!"
              $hasUpdates = $true
            } else {
              Write-Host "  $appName check skipped or failed (non-fatal)."
            }
          }
          echo "hasUpdates=$hasUpdates" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit changes
        shell: pwsh
        if: env.hasUpdates == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: auto-update manifests"
          git push

      - name: No updates
        shell: pwsh
        if: env.hasUpdates != 'True'
        run: Write-Host "All manifests are up to date. Nothing to commit."
