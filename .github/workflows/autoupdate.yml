name: Auto-Update Manifests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod get.scoop.sh | Invoke-Expression

      - name: Check and update manifests
        shell: pwsh
        run: |
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App * -Dir "${{ github.workspace }}\bucket" -Update

      - name: Sync README app table with manifests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const bucketDir = process.env.GITHUB_WORKSPACE + '/bucket';
            const files = fs.readdirSync(bucketDir).filter(f => f.endsWith('.json')).sort();
            const rows = [];
            for (const file of files) {
              const m = JSON.parse(fs.readFileSync(path.join(bucketDir, file), 'utf8'));
              rows.push(`| [${path.basename(file, '.json')}](${m.homepage || ''}) | ${m.description || ''} | ${m.version || ''} |`);
            }
            const table = '| 应用 | 描述 | 版本 |\n|------|------|------|\n' + rows.join('\n');
            const readmePath = process.env.GITHUB_WORKSPACE + '/README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            const re = /<!-- APPS_TABLE_BEGIN -->[\s\S]*?<!-- APPS_TABLE_END -->/;
            const updated = readme.replace(re, '<!-- APPS_TABLE_BEGIN -->\n' + table + '\n<!-- APPS_TABLE_END -->');
            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
              console.log('README synced.');
            }

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update manifests"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.head_ref }}
